[project]
name = "bc"
authors = [{ name = "Hoang Giang JSC", email = "chien@1nguoi.com" }]
description = "Báo cáo điều hành cho Ban lãnh đạo RVHG (Frappe/ERPNext v16 custom app)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "bc"

[tool.ruff]
line-length = 110
target-version = "py310"
